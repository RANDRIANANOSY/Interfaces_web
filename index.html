<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Courses Catalog - Learn Web & Programming</title>
  <meta name="description" content="Browse our catalog of professional programming and computer science courses. Filter by language, technology, level, and price.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="filter-header">
    <div class="filter-container">
      
      <div class="filter-group language-group">
        <label class="sr-only">Filter by language</label>
        <div class="lang-flags" id="languageFilters" role="group" aria-label="Language selector">
          <button type="button" class="lang-btn active" data-lang="all" title="All languages">
            <span class="flag-icon globe-icon">🌐</span>
            <span class="lang-code">ALL</span>
          </button>
          <button type="button" class="lang-btn" data-lang="fr" title="Français">
            <span class="flag-icon">🇫🇷</span>
            <span class="lang-code">FR</span>
          </button>
          <button type="button" class="lang-btn" data-lang="en" title="English">
            <span class="flag-icon">🇬🇧</span>
            <span class="lang-code">EN</span>
          </button>
          <button type="button" class="lang-btn" data-lang="mg" title="Malagasy">
            <span class="flag-icon">🇲🇬</span>
            <span class="lang-code">MG</span>
          </button>
        </div>
      </div>

      <div class="filter-group">
        <label for="techFilter" class="sr-only">Technologies</label>
        <div class="custom-select-wrapper">
          <select id="techFilter" class="filter-select" aria-label="Filter by technology">
            <option value="all">All technologies</option>
            <option value="Javascript">Javascript</option>
            <option value="Java">Java</option>
            <option value="Relational Databases">Relational Databases</option>
            <option value="Git & Version Control">Git &amp; Version Control</option>
            <option value="Python">Python</option>
            <option value="React">React</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>
      </div>

      <div class="filter-group">
        <label for="levelFilter" class="sr-only">Level</label>
        <div class="custom-select-wrapper">
          <select id="levelFilter" class="filter-select" aria-label="Filter by level">
            <option value="all">All levels</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>
      </div>

      <div class="filter-group price-filter-group">
        <div class="price-header-label">
          <span class="filter-title">MAX PRICE:</span>
          <span id="priceDisplay" class="price-val">300,000 MGA</span>
        </div>
        <div class="slider-wrapper">
          <input 
            type="range" 
            id="priceFilter" 
            min="50000" 
            max="300000" 
            step="10000" 
            value="300000" 
            class="price-slider"
            aria-label="Filter courses by maximum price"
          >
        </div>
      </div>

      <div class="filter-group search-group">
        <label for="keywordFilter" class="sr-only">Search Keyword</label>
        <div class="search-input-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="keywordFilter" 
            class="filter-input" 
            placeholder="Keyword..." 
            autocomplete="off"
            aria-label="Search courses by keyword"
          >
          <button type="button" id="clearKeyword" class="clear-btn" title="Clear search" aria-label="Clear search">✕</button>
        </div>
      </div>

      <div class="filter-group cart-group">
        <button id="resetFilters" class="reset-btn" title="Reset all filters">Reset</button>
        <div class="cart-pill" id="cartPill" title="Cart items">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span id="cartCount" class="cart-badge">0</span>
        </div>
      </div>

    </div>
  </header>

  <main class="main-content">
    <div class="results-header">
      <p id="resultsCount" class="results-text">Showing <strong>4</strong> courses</p>
    </div>

    <div id="coursesGrid" class="courses-grid" aria-live="polite">
    </div>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">🔍</div>
      <h3>No courses found</h3>
      <p>Try adjusting your search criteria or price range to find available courses.</p>
      <button type="button" class="btn-primary" id="btnResetEmpty">Reset all filters</button>
    </div>
  </main>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
